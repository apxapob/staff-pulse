name: Check Staff Pulse

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: docker compose -f docker-compose.yml -f docker-compose.ai.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.ai.yml -f docker-compose.gpu.yml config --quiet
      - run: npm start -- --detach --wait
      - run: curl --fail http://localhost:8080/api/health
      - run: curl --fail http://localhost:8080/
      - if: always()
        run: docker compose down
